<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a9ddef" />
    <meta name="description" content="可行走的手绘浮岛世界地图原型" />
    <title>人生群岛</title>
  </head>
  <body>
    <main class="app-shell">
      <canvas id="world-canvas" aria-label="可探索世界地图"></canvas>
      <div class="paper-texture" aria-hidden="true"></div>

      <header class="world-title" aria-label="地图名称">
        <h1>人生群岛</h1>
        <span class="world-title__subtitle">从家出发，一座一座岛屿前行</span>
      </header>

      <button
        id="overview-button"
        class="overview-button"
        type="button"
        aria-label="查看全岛"
        aria-pressed="false"
      >
        <span aria-hidden="true">⛶</span>
        <small>全岛</small>
      </button>

      <aside class="map-legend" aria-label="地图地点">
        <span class="map-legend__title">旅行手记</span>
        <ul>
          <li data-location-id="home">
            <i class="marker marker--home"></i>
            <span>家庭小屋</span>
            <small data-location-state></small>
          </li>
          <li data-location-id="mountain">
            <i class="marker marker--mountain"></i>
            <span>爬山岛</span>
            <small data-location-state></small>
          </li>
          <li data-location-id="office">
            <i class="marker marker--office"></i>
            <span>工作岛</span>
            <small data-location-state></small>
          </li>
          <li class="map-legend__future">
            <i class="marker"></i>
            <span>后续旅程</span>
            <small>7 座岛在云中</small>
          </li>
        </ul>
      </aside>

      <aside id="location-card" class="location-card" aria-live="polite">
        <span class="location-card__label">发现地点</span>
        <h2 id="location-name"></h2>
        <p id="location-description"></p>
        <small id="location-hint">靠近后点击进入</small>
      </aside>

      <section class="controls" aria-label="操作说明">
        <span class="controls__label">移动</span>
        <span class="key-cluster" aria-hidden="true">
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
        </span>
        <span class="controls__divider"></span>
        <span>方向键也可以</span>
        <span class="controls__mouse">点击道路移动 · 点击地标进入</span>
      </section>

      <section id="status" class="status" aria-live="polite">
        从家庭小屋出发，先前往爬山岛
      </section>

      <dialog id="character-dialog" class="character-dialog" aria-labelledby="character-title">
        <span class="character-dialog__eyebrow">旅程开始之前</span>
        <h2 id="character-title">选择你的旅人</h2>
        <p>角色会根据行走方向显示正面、侧面和背面。</p>
        <div class="character-options">
          <button type="button" class="character-option" data-character="boy">
            <canvas width="112" height="132" aria-hidden="true"></canvas>
            <strong>男生</strong>
            <small>蓬松短发 · 圆框眼镜</small>
          </button>
          <button type="button" class="character-option" data-character="girl">
            <canvas width="112" height="132" aria-hidden="true"></canvas>
            <strong>女生</strong>
            <small>棕色长卷发 · 粉色短袖</small>
          </button>
        </div>
        <small class="character-dialog__hint">点击角色即可进入地图</small>
      </dialog>

      <dialog id="scene-dialog" class="scene-dialog">
        <div class="scene-dialog__ornament" aria-hidden="true">✦</div>
        <span id="dialog-label" class="scene-dialog__label">独 立 场 景</span>
        <h2 id="dialog-title"></h2>
        <p id="dialog-description"></p>
        <button id="dialog-primary" class="scene-dialog__complete" type="button" hidden></button>
        <button id="dialog-close" type="button" aria-label="返回世界地图">
          返回世界地图
        </button>
      </dialog>

      <section id="home-scene" class="home-scene" aria-label="雾谷序章" hidden>
        <canvas id="home-scene-canvas" class="home-scene__canvas" aria-hidden="true"></canvas>
        <div class="home-scene__panel">
          <p id="home-progress" class="home-scene__progress"></p>
          <h2 id="home-stage-title"></h2>
          <p id="home-story-text" class="home-scene__story" aria-live="polite"></p>
          <div id="home-choices" class="home-scene__choices" aria-label="回应选择"></div>

          <form id="traveler-record" class="traveler-record" hidden>
            <p class="traveler-record__intro">三项都会成为你在雾谷的第一笔正式记录。</p>
            <label for="traveler-nickname">旅人昵称</label>
            <input id="traveler-nickname" name="nickname" maxlength="20" autocomplete="nickname" placeholder="1—20 个字符" />
            <small id="traveler-nickname-error" class="traveler-record__error"></small>

            <label for="traveler-message">想留在册子上的一句话</label>
            <textarea id="traveler-message" name="message" maxlength="80" rows="3" placeholder="1—80 个字符"></textarea>
            <small id="traveler-message-error" class="traveler-record__error"></small>

            <label for="traveler-mbti">你的性格类型</label>
            <select id="traveler-mbti" name="mbtiType">
              <option value="">请选择</option>
              <option>ISTJ</option><option>ISFJ</option><option>INFJ</option><option>INTJ</option>
              <option>ISTP</option><option>ISFP</option><option>INFP</option><option>INTP</option>
              <option>ESTP</option><option>ESFP</option><option>ENFP</option><option>ENTP</option>
              <option>ESTJ</option><option>ESFJ</option><option>ENFJ</option><option>ENTJ</option>
            </select>
            <small id="traveler-mbti-error" class="traveler-record__error"></small>
            <button id="traveler-record-submit" type="submit">写入《旅人的记录》</button>
          </form>

          <p id="home-save-warning" class="home-scene__warning" role="alert" hidden>
            记录暂时无法保存，请重试。
          </p>
          <button id="home-continue" class="home-scene__continue" type="button">继续</button>
        </div>
      </section>

      <section id="mountain-scene" class="mountain-scene" aria-label="爬山岛剧情" hidden>
        <canvas id="mountain-scene-canvas" class="mountain-scene__canvas" aria-hidden="true"></canvas>
        <div class="mountain-scene__panel">
          <p id="mountain-progress" class="mountain-scene__progress"></p>
          <h2 id="mountain-stage-title"></h2>
          <p id="mountain-story-text" aria-live="polite"></p>
          <div id="mountain-choices" class="mountain-scene__choices" aria-label="剧情选择"></div>
          <p id="mountain-save-warning" class="mountain-scene__warning" role="alert" hidden>
            当前选择暂未保存，请不要关闭页面，完成旅程后将再次尝试保存。
          </p>
          <div class="mountain-scene__footer">
            <button id="mountain-continue" type="button" hidden></button>
            <button id="mountain-close" type="button">返回世界地图</button>
          </div>
        </div>
      </section>

      <section id="compatibility-error" class="compatibility-error" hidden>
        <h2>地图暂时无法展开</h2>
        <p>当前浏览器无法创建二维画布，请尝试更新浏览器。</p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
