<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#dcebf0" />
    <meta
      name="description"
      content="雾谷九十厘米乘六十厘米横版海报构图预览"
    />
    <title>雾谷海报预览</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #584137;
        --ink-soft: #735f53;
        --rose: #a96d62;
        --gold: #b88a4b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        padding: clamp(10px, 2vw, 28px);
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 20%, #edf5f6 0, transparent 48%),
          #b9d4dc;
      }

      .poster-shell {
        position: relative;
        width: min(calc(100vw - 20px), calc((100svh - 20px) * 1.5));
        aspect-ratio: 3 / 2;
        overflow: hidden;
        isolation: isolate;
        background: linear-gradient(#dcebf0, #f5e5c8 76%, #d1bd94);
        border-radius: 7px;
        box-shadow: 0 24px 80px rgb(68 74 71 / 35%);
      }

      .world-art {
        position: absolute;
        inset: 0;
        z-index: -3;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .poster-shell::before {
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(
            ellipse at 23% 15%,
            rgb(249 245 229 / 84%) 0,
            rgb(245 241 225 / 48%) 24%,
            transparent 52%
          ),
          linear-gradient(180deg, rgb(255 255 255 / 8%), transparent 44%);
        content: "";
        pointer-events: none;
      }

      .poster-shell::after {
        position: absolute;
        inset: 2.1%;
        z-index: 2;
        border: 1px solid rgb(116 86 59 / 24%);
        border-radius: 22px;
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 28%);
        content: "";
        pointer-events: none;
      }

      .copy {
        position: absolute;
        top: 7.2%;
        left: 6.6%;
        display: flex;
        align-items: flex-end;
        gap: clamp(18px, 2.2vw, 36px);
        width: 72%;
        color: var(--ink);
        text-shadow: 0 2px 0 rgb(255 255 255 / 42%);
      }

      .brand {
        margin: 0;
        font-family: Georgia, "Times New Roman", "Songti SC", serif;
        font-size: clamp(72px, 9.6vw, 156px);
        font-weight: 600;
        line-height: 0.88;
        letter-spacing: -0.055em;
      }

      .brand::after {
        display: inline-block;
        width: 0.12em;
        height: 0.12em;
        margin-left: 0.07em;
        background: var(--rose);
        border-radius: 50%;
        box-shadow: 0.17em -0.1em 0 -0.025em #c99a6d;
        content: "";
        vertical-align: 0.12em;
      }

      .descriptor {
        margin: 0 0 0.74em;
        color: var(--gold);
        font-family: "STKaiti", "KaiTi", "Songti SC", serif;
        font-size: clamp(14px, 1.45vw, 23px);
        font-weight: 700;
        letter-spacing: 0.3em;
        white-space: nowrap;
      }

      .tagline {
        position: absolute;
        right: 6.6%;
        bottom: 7.2%;
        margin: 0;
        color: var(--ink-soft);
        font-family: "STKaiti", "KaiTi", "Songti SC", serif;
        font-size: clamp(18px, 1.75vw, 28px);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-shadow:
          0 2px 0 rgb(255 255 255 / 58%),
          0 0 18px rgb(255 248 231 / 72%);
      }

      .fallback {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 8%;
        color: var(--ink);
        background: linear-gradient(#dcebf0, #f5e5c8);
        font: 700 clamp(16px, 2vw, 30px) / 1.6 "STKaiti", "KaiTi", serif;
        text-align: center;
      }

      .fallback[hidden] {
        display: none;
      }

      @page {
        size: 90cm 60cm;
        margin: 0;
      }

      @media print {
        html,
        body {
          width: 90cm;
          height: 60cm;
          padding: 0;
          background: none;
        }

        .poster-shell {
          width: 90cm;
          height: 60cm;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="poster" class="poster-shell" aria-label="雾谷项目海报">
      <img
        id="world-art"
        class="world-art"
        src="assets/reso-world.png"
        alt="两条人生道路穿过浮岛云海，最终汇聚成一座桥，一对情侣牵手走向远方"
      />

      <section class="copy" aria-label="项目亮点">
        <h1 class="brand">雾谷</h1>
        <p class="descriptor">人生底色 · 关系匹配</p>
      </section>
      <p class="tagline">从不同人生出发，走向真正契合的相遇。</p>
      <p id="fallback" class="fallback" hidden>
        海报插画暂时无法显示，请确认图片资源与预览页位于同一目录。
      </p>
    </main>

    <script>
      (function () {
        var image = document.getElementById("world-art");
        var fallback = document.getElementById("fallback");

        function showFallback() {
          image.hidden = true;
          fallback.hidden = false;
        }

        image.addEventListener("error", showFallback);
        if (image.complete && image.naturalWidth === 0) showFallback();
      })();
    </script>
  </body>
</html>
