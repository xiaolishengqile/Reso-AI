<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071721" />
    <meta
      name="description"
      content="九十厘米乘六十厘米的横版项目海报预览"
    />
    <title>项目海报预览</title>
    <style>
      :root {
        color-scheme: dark;
        background: #02080d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        padding: clamp(10px, 2vw, 28px);
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 18%, #17394a 0, transparent 42%),
          #02080d;
      }

      .poster-shell {
        width: min(calc(100vw - 20px), calc((100svh - 20px) * 1.5));
        aspect-ratio: 3 / 2;
        overflow: hidden;
        background: #071721;
        border-radius: 6px;
        box-shadow: 0 24px 80px rgb(0 0 0 / 55%);
      }

      object {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .fallback {
        display: grid;
        place-items: center;
        height: 100%;
        padding: 32px;
        color: #f4e9d0;
        font: 600 18px/1.6 system-ui, sans-serif;
        text-align: center;
      }

      @page {
        size: 90cm 60cm;
        margin: 0;
      }

      @media print {
        html,
        body {
          width: 90cm;
          height: 60cm;
          padding: 0;
          background: none;
        }

        .poster-shell {
          width: 90cm;
          height: 60cm;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="poster-shell" aria-label="项目海报">
      <object data="poster.svg" type="image/svg+xml">
        <p class="fallback">海报暂时无法显示，请确认矢量文件与预览页位于同一目录。</p>
      </object>
    </main>
  </body>
</html>
